[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat"
version = "0.1.0"
description = "Nativní čtečka dokumentů Markdown pro GNOME"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ondrej Flidr", email = "flidr@webeo.cz" }]

[project.scripts]
seshat = "seshat.main:main"

[tool.setuptools.packages.find]
include = ["seshat*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
